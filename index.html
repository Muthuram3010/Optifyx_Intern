<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        h2 {
            margin-top: 20px;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Predict House Price</h1>
        <form method="POST" action="/predict">
            <label for="area">Area (sq ft):</label>
            <input type="text" name="area" placeholder="Enter area" required>

            <label for="bedrooms">Bedrooms:</label>
            <input type="text" name="bedrooms" placeholder="Enter number of bedrooms" required>

            <label for="bathrooms">Bathrooms:</label>
            <input type="text" name="bathrooms" placeholder="Enter number of bathrooms" required>

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <h2>Predicted Price: {{ prediction }}</h2>
        {% endif %}
    </div>
</body>
</html>
